  --ar:1.203; --bt:57.12%; --bb:79.39%;

  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;display:flex;align-items:center;justify-content:center;background:transparent;overflow:hidden}

/* The logo is sized by whichever is tighter: width or height of the embed block */
.stage{position:relative;width:min(94vw,calc(94vh*var(--ar)),780px);aspect-ratio:var(--ar);cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none}
.stage:focus-visible{outline:2px solid #1c4170;outline-offset:6px}
.wrap,.layer{position:absolute;inset:0}
.layer{background:var(--logo) center/100% 100% no-repeat}

/* shield + flag + crown = everything except the ribbon band */
.shield{clip-path:polygon(0 0,100% 0,100% var(--bt),0 var(--bt),0 var(--bb),100% var(--bb),100% 100%,0 100%)}
/* ribbon band only */
.ribbon{clip-path:inset(var(--bt) 0 calc(100% - var(--bb)) 0)}
/* light sweep, masked to the logo's own shape */
.shine{
  -webkit-mask:var(--logo) center/100% 100% no-repeat;mask:var(--logo) center/100% 100% no-repeat;
  background:linear-gradient(100deg,transparent 38%,rgba(255,255,255,.85) 50%,transparent 62%) 100% 0/300% 100% no-repeat;
  pointer-events:none}
/* glint on the crown */
.spark{position:absolute;left:49.5%;top:21.9%;width:11%;aspect-ratio:1;background:#fff;
  clip-path:polygon(50% 0,59% 41%,100% 50%,59% 59%,50% 100%,41% 59%,0 50%,41% 41%);
  transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none}

.play .wrap.s{animation:rise 1.2s var(--ease-out) .15s both}
.play .wrap.r{animation:unfurl .95s cubic-bezier(.65,0,.2,1) .85s both}
.play .shine{animation:sweep 1.3s ease-in-out 1.95s both}
.play .spark{animation:glint .9s ease-out 2.35s both}

@keyframes rise{
  from{opacity:0;transform:translateY(8%) scale(.88);filter:blur(10px)}
  to{opacity:1;transform:none;filter:blur(0)}}
@keyframes unfurl{
  from{clip-path:inset(0 50% 0 50%)}
  to{clip-path:inset(0 0 0 0)}}
@keyframes sweep{from{background-position:100% 0}to{background-position:0 0}}
@keyframes glint{
  0%{opacity:0;transform:translate(-50%,-50%) scale(0) rotate(-35deg)}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(0) rotate(35deg)}}

@media (prefers-reduced-motion:reduce){
  .play .wrap,.play .shine,.play .spark{animation:none}
  .shine,.spark{display:none}
}
</style>
</head>
<body>
<main class="stage play" id="stage" role="img" aria-label="Royal Street British Academy logo" tabindex="0" title="Tap to replay">
  <div class="wrap s"><div class="layer shield"></div></div>
  <div class="wrap r"><div class="layer ribbon"></div></div>
  <div class="layer shine"></div>
  <i class="spark"></i>
</main>
<script>
(function(){
  var s=document.getElementById('stage');
  function replay(){s.classList.remove('play');void s.offsetWidth;s.classList.add('play');}
  s.addEventListener('click',replay);
  s.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();replay();}});
})();
</script>
</body>
</html>
