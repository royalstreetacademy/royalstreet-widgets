html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent;overscroll-behavior:none}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
/* exact square, dead centre of whatever space the iframe gives it */
.stage{position:fixed;inset:0;margin:auto;width:min(100vmin,760px);height:min(100vmin,760px);pointer-events:none}
.logo{position:absolute;inset:0;background:var(--logo) center/100% 100% no-repeat;transform-origin:50% 50%;backface-visibility:hidden}
.armed .logo{opacity:0;transform:scale(.2)}
.play .logo{animation:approach 3.2s cubic-bezier(.16,.78,.22,1) both,emerge 1.8s cubic-bezier(.33,0,.2,1) both}
@keyframes approach{from{transform:scale(.2)}to{transform:scale(1)}}
@keyframes emerge{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.armed .logo{opacity:1;transform:none}.play .logo{animation:none}}
</style></head>
<body>
<div class="stage" id="stage" role="img" aria-label="Royal Street British Academy logo"><div class="logo"></div></div>
<script>
(function(){
  var s=document.getElementById('stage');
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  s.classList.add('armed');
  var started=false,seen=false;
  function go(){if(started)return;started=true;void s.offsetWidth;s.classList.add('play');}
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(e){seen=true;if(e[0].isIntersecting){io.disconnect();go();}},{threshold:.5});
    io.observe(s);
    setTimeout(function(){if(!seen)go();},1500);
  }else{go();}
})();
</script></body></html>
